name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend/app
      - name: Test
        run: pytest tests -q
        env:
          BROKER: mock
          DATABASE_URL: sqlite:///./test.db

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix frontend || npm install --prefix frontend
      - run: npm run build --prefix frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantdesk-backend ./backend

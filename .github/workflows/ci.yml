name: CI

on:
  push: {branches: [master]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The write path is the part of this system that can silently corrupt a
    # dataset, so it is tested against the database it actually runs on and
    # not only against SQLite. `data/upsert.py` narrows the dialect gap;
    # this is what proves it closed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quantdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quant -d quantdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend/app
      - name: Test
        run: pytest tests -q
        env:
          BROKER: mock
          DATABASE_URL: sqlite:///./test.db
          TEST_DATABASE_URL: postgresql+psycopg://quant:quant@localhost:5432/quantdesk_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantdesk-backend ./backend

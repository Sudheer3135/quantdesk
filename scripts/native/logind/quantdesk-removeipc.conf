# /etc/systemd/logind.conf.d/quantdesk-removeipc.conf on the Azure host.
# PostgreSQL runs as azureuser, an ordinary login user. With logind's default
# RemoveIPC=yes, the user's shared memory is deleted when their last login
# session ends — PostgreSQL's included — and every new connection then fails
# with "could not open shared memory segment". Seen on the VM after its first
# reboot. Also: loginctl enable-linger azureuser. (PostgreSQL docs, "systemd
# RemoveIPC".)
[Login]
RemoveIPC=no

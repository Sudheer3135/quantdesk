# Installed as /etc/systemd/system/caddy.service.d/quantdesk.conf.
#
# Gives the packaged caddy.service the site's settings and secrets from a
# root-only file, so none of them is written in the Caddyfile or the
# repository. The API it forwards to is quantdesk-api; Caddy starts without it
# and answers 502 until it is up, so this adds no ordering to the desk's units.
#
# The two CPU settings contain Caddy's own processor use and nothing more.
# Checking a password is deliberately slow (bcrypt, cost 14), the site is on
# the open internet, and the scheduler, the feed and the paper engine share
# this VM's cores. Caddy may use at most half of one core, and gets a small
# share when the machine is busy.
#
# This is not rate limiting and not protection against denial of service. It
# does not bound Caddy's memory, the number of connections, network traffic,
# or the work that forwarded requests cause in the API. Enough traffic can
# still make the dashboard unavailable.
[Service]
EnvironmentFile=/etc/quantdesk/caddy.env
CPUQuota=50%
CPUWeight=20

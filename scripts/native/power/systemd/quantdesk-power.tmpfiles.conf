# /etc/tmpfiles.d/quantdesk-power.conf - the request directory on tmpfs.
# 0711: anyone may pass through /run/quantdesk-power; nobody but root may list it.
# 1730: the requester's group may create files (and remove only its own, sticky);
# only root may list or read the directory. The requester walks both with
# search-only descriptors (O_PATH), so it needs no read permission on either.
d /run/quantdesk-power 0711 root root -
d /run/quantdesk-power/requests 1730 root quantdesk-power -

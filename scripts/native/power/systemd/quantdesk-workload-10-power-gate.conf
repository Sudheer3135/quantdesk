# The admission gate, as a drop-in on each QuantDesk workload unit:
#   /etc/systemd/system/quantdesk-postgres.service.d/10-power-gate.conf
#   /etc/systemd/system/quantdesk-redis.service.d/10-power-gate.conf
#   /etc/systemd/system/quantdesk-api.service.d/10-power-gate.conf
#   /etc/systemd/system/quantdesk-web.service.d/10-power-gate.conf
# Before every start (boot, restart, by hand) systemd runs the gate as root
# ("+"). It refuses the start - and the unit fails visibly - while a shutdown
# transaction is stopping the workload in this boot (except the transaction's
# own restoration), while a deallocation is unresolved, and whenever the
# journal, the state directory or the boot id cannot be read (fail closed).
# It reads the journal only. See ../quantdesk_power/gate.py.
#
# NOT INSTALLED. Disabled template.
[Service]
ExecStartPre=+/usr/bin/python3 -I /opt/quantdesk-power/power.py gate --config /etc/quantdesk-power/power.json --unit %n

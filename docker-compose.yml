services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quantdesk
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quantdesk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    # Loopback by default. The API has no authentication on its read
    # endpoints, so publishing it on every interface put the desk on the
    # local network for anyone who scanned for it. Set BIND_HOST=0.0.0.0 in
    # .env to expose it deliberately.
    ports: ["${BIND_HOST:-127.0.0.1}:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./backend/app:/srv/app
      - ./backend/alembic:/srv/alembic
      - ./scripts:/scripts
    # Name resolution, bounded and not left to the host.
    #
    # On 24 and 25-Aug-2026 this container logged 268 DNS failures in eight
    # hours while the host resolved the same names fine. Docker's embedded
    # resolver forwards whatever the host's /etc/resolv.conf points at, so
    # the desk inherited a resolver it never chose — a VPN's, a captive
    # portal's, one that had gone away — and outbound calls stopped failing
    # and started *hanging*, which is far worse: `getaddrinfo` is a blocking
    # C call that no Python timeout can interrupt.
    #
    # Two named forwarders instead. Service names still resolve: on a
    # user-defined network the container still asks Docker's embedded server
    # at 127.0.0.11, and these are only what it forwards to, so `postgres`
    # and `redis` are unaffected. Both are overridable, so nothing here is
    # wedded to one address.
    dns:
      - ${DNS_SERVER_1:-1.1.1.1}
      - ${DNS_SERVER_2:-8.8.8.8}
    # The bound on the hang itself, and the reason this is a Compose fix
    # rather than an application one. glibc defaults to five seconds per
    # nameserver and two rounds; at two seconds and two rounds a resolution
    # that is going to fail fails in about four, inside the option
    # collector's budget instead of many times over it.
    dns_opt:
      - timeout:2
      - attempts:2
    # Migrations run before the app, never from inside it. A process that
    # migrates its own schema on boot will happily run three copies of the
    # same migration when you scale it to three replicas.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports: ["${BIND_HOST:-127.0.0.1}:5173:5173"]
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:8000
      # The live-price socket requires the same key as the write endpoints.
      # Without this the browser's handshake is rejected, the dashboard
      # silently falls back to its slow HTTP poll, and the price goes stale
      # while everything else looks healthy. Empty when no key is set, which
      # is the correct value for a desk running open on localhost.
      VITE_API_KEY: ${API_KEY:-}
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
